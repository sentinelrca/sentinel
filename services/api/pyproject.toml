[project]
name = "sentinel-api"
version = "0.1.0"
description = "SentinelAI REST API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "bcrypt>=4.1",
    "python-dotenv>=1.0",
    "sentinel-pipeline",
    "sentinel-connectors-base",
    "sentinel-connectors-langfuse",
    "sentinel-connectors-langsmith",
    "sentinel-connectors-arize",
    "clickhouse-driver>=0.2",
    "celery[redis]>=5.3",
]

[tool.uv.sources]
sentinel-pipeline             = { path = "../../services/pipeline",   editable = true }
sentinel-connectors-base      = { path = "../../connectors/_base",    editable = true }
sentinel-connectors-langfuse  = { path = "../../connectors/langfuse", editable = true }
sentinel-connectors-langsmith = { path = "../../connectors/langsmith", editable = true }
sentinel-connectors-arize     = { path = "../../connectors/arize",    editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_api"]

[project]
name = "sentinel-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "sentinel-pipeline",
    "sentinel-connectors-base",
    "sentinel-connectors-langfuse",
    "sentinel-connectors-langsmith",
]

[tool.uv.sources]
sentinel-pipeline             = { path = "../services/pipeline",    editable = true }
sentinel-connectors-base      = { path = "../connectors/_base",     editable = true }
sentinel-connectors-langfuse  = { path = "../connectors/langfuse",  editable = true }
sentinel-connectors-langsmith = { path = "../connectors/langsmith", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["."]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

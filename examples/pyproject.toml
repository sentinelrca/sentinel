[project]
name = "sentinel-examples"
version = "0.1.0"
description = "Multi-agent example scenarios that demonstrate SentinelAI rule detection"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-ollama>=0.2",
    "langfuse>=3.0",
    "langsmith>=0.1",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "clickhouse-driver>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "scenarios"]

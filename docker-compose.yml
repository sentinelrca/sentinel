services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "9000:9000"   # native protocol
      - "8123:8123"   # HTTP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/ingestor/src:/app/src
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://sentinel:sentinel@postgres:5432/sentinel}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-clickhouse://clickhouse:9000/sentinel}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SENTINEL_ENV=${SENTINEL_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/api/src:/app/src
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://sentinel:sentinel@postgres:5432/sentinel}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-clickhouse://clickhouse:9000/sentinel}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SENTINEL_ENV=${SENTINEL_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    volumes:
      - ./services/worker/src:/app/src
      - ./services/pipeline/src:/pipeline/src
      - ./connectors:/connectors
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://sentinel:sentinel@postgres:5432/sentinel}
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-clickhouse://clickhouse:9000/sentinel}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SENTINEL_ENV=${SENTINEL_ENV:-development}
      - PYTHONPATH=/pipeline/src:/connectors/_base/src:/connectors/langfuse/src
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:

[project]
name = "sentinel-connectors-base"
version = "0.1.0"
description = "SentinelAI Connector ABC and shared connector types"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sentinel-pipeline",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_connectors"]

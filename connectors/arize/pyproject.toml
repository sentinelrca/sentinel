[project]
name = "sentinel-connectors-arize"
version = "0.1.0"
description = "SentinelAI connector for Arize Phoenix"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sentinel-connectors-base",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_connectors"]

[tool.ruff]
line-length = 100
target-version = "py312"

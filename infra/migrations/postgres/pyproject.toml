[project]
name = "sentinel-migrations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "sentinel-pipeline",
]

[tool.uv]
package = false

[tool.uv.sources]
sentinel-pipeline = { path = "../../../services/pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
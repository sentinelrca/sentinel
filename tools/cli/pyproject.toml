[project]
name = "sentinel-cli"
version = "0.1.0"
description = "SentinelAI command-line interface"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "sentinel-pipeline",
    "sentinel-connectors-base",
    "sentinel-connectors-langfuse",
]

[project.scripts]
sentinel = "sentinel_cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_cli"]

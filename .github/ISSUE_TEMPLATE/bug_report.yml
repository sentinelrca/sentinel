name: Bug report
description: Something is broken or behaving incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "sentinel analyze fired agent_loop on a trace that has no loop..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "Expected no insight to fire for this trace."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect source X
        2. Run `sentinel analyze ...`
        3. See insight Y fire on trace Z
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Trace details (anonymized)
      description: Span structure, timing, agent names — no prompt content needed.
      placeholder: |
        trace_id: abc123
        spans:
          - span_id: s1, kind: AGENT_INVOKE, agent_name: PlannerAgent
          - span_id: s2, kind: LLM_CALL, parent: s1
          ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Sentinel version
      placeholder: "e.g. v0.2.1 or commit sha"
    validations:
      required: false

  - type: dropdown
    id: source
    attributes:
      label: Trace source
      options:
        - Langfuse
        - LangSmith
        - CLI (local file)
        - Other
    validations:
      required: false

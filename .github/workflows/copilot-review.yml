name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: github/copilot-pull-request-reviewer@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Every Python package under this list is synced with its `dev` extra,
  # then linted / format-checked / type-checked. Keep in sync across the
  # lint-python, format-python, and typecheck-python jobs below.
  PYTHON_PACKAGES: >-
    services/api services/pipeline services/worker services/ingestor
    connectors/_base connectors/langfuse connectors/langsmith connectors/arize
    tools/cli

jobs:
  # ── Python: lint ───────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Ruff check
        run: |
          for dir in $PYTHON_PACKAGES; do
            echo "▶ ruff check $dir"
            (cd "$dir" && uv sync --extra dev && uv run ruff check src/)
          done

  # ── Python: format ─────────────────────────────────────────────────────────
  format-python:
    name: Format Check Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Ruff format --check
        run: |
          for dir in $PYTHON_PACKAGES; do
            echo "▶ ruff format --check $dir"
            (cd "$dir" && uv sync --extra dev && uv run ruff format --check src/)
          done

  # ── Python: type check ─────────────────────────────────────────────────────
  typecheck-python:
    name: Type Check Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: mypy
        run: |
          for dir in $PYTHON_PACKAGES; do
            echo "▶ mypy $dir"
            (cd "$dir" && uv sync --extra dev && uv run mypy src/)
          done

  # ── Python: unit tests ────────────────────────────────────────────────────
  test-python:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install test dependencies
        working-directory: tests
        run: uv sync --no-install-project

      - name: Run unit tests
        working-directory: tests
        run: uv run --no-project pytest unit/ -v --tb=short
        env:
          DATABASE_URL: "postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel"
          CLICKHOUSE_URL: "clickhouse://localhost:9000/sentinel"

  # ── TypeScript: lint + type check ─────────────────────────────────────────
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        working-directory: services/ui
        run: npm ci

      - name: ESLint
        working-directory: services/ui
        run: npm run lint

      - name: TypeScript type check
        working-directory: services/ui
        run: npx tsc --noEmit
